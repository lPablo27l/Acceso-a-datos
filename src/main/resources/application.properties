spring.application.name=aadtex-ingestion
spring.main.web-application-type=none
aadtex.data-dir=./store_data
aadtex.generate-demo=true
aadtex.scheduler-enabled=true
logging.file.name=${aadtex.data-dir}/logs/aadtex.log
logging.charset.file=UTF-8
logging.charset.console=UTF-8
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
